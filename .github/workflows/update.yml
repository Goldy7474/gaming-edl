name: Update Gaming EDL IPs

on:
  schedule:
    - cron: '0 */12 * * *'  # הרצה מתוזמנת פעמיים ביום
  workflow_dispatch:        # מאפשר הרצה יזומה ידנית מתוך ממשק GitHub

permissions:
  contents: write

jobs:
  update-edl:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run ASN Resolution Script
        run: python update_ips.py

      - name: Commit and push if changed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update Gaming EDL IP list [skip ci]"
          file_pattern: "gaming_ips.txt"
