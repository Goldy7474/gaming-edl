name: Update Games EDL IPs

on:
  schedule:
    - cron: '0 */6 * * *' # הרצה אוטומטית כל 6 שעות
  workflow_dispatch: # מאפשר הרצה ידנית מתוך ממשק GitHub Actions

permissions:
  contents: write

jobs:
  update-edl:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Resolution Script
        run: python update_ips.py

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update Games EDL IP list [skip ci]"
          file_pattern: "gaming_ips.txt"
